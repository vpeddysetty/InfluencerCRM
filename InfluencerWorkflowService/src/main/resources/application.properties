# =============================================================
# Collaboration Workflow service
# First extracted context (docs/EXTRACTION-RUNBOOK.md).
# =============================================================
server.port=${WORKFLOW_SERVICE_PORT:8444}

# Connects as svc_workflow, NOT influencercrm_user. That role is granted only the
# workflow schema, plus insert on the outbox and read on the tenancy spine, so a
# query against another context's tables fails at the database rather than at review.
spring.datasource.url=${WORKFLOW_DB_URL:jdbc:postgresql://localhost:5432/influencercrm_db?stringtype=unspecified}
spring.datasource.username=${WORKFLOW_DB_USER:svc_workflow}
spring.datasource.password=${WORKFLOW_DB_PASSWORD:change-me-workflow}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# The role's search_path already resolves workflow, shared, identity, public — set by
# the context-roles migration — so entities keep using unqualified table names.

# Internal service: only the gateway may call it. Must match
# web-experience.workflow-service-token on the gateway side.
workflow.service-token=${WORKFLOW_SERVICE_TOKEN:wdZcoE9N3fhGST9heyi4QAXRTiFGWC5jKHhdyl05Pk8}

# Readiness/liveness for the cutover.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
