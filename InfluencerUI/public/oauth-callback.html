<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signing you in…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f1115;
        color: #e6e8ec;
      }
      .card {
        text-align: center;
        padding: 2rem 2.5rem;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 1rem;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #7aa2ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error { color: #ff8080; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner" id="spinner"></div>
      <p id="message">Completing sign-in…</p>
    </div>
    <script>
      // The BFF redirected here after the OAuth code exchange, encoding the
      // result in the URL fragment (never sent to a server / not logged):
      //   #result=<base64url(JSON AuthResponse)>   on success
      //   #error=<url-encoded message>             on failure
      (function () {
        var messageEl = document.getElementById('message');
        var spinnerEl = document.getElementById('spinner');

        function showError(text) {
          spinnerEl.style.display = 'none';
          messageEl.className = 'error';
          messageEl.textContent = text;
        }

        function parseFragment() {
          var hash = window.location.hash.replace(/^#/, '');
          var params = new URLSearchParams(hash);
          return { result: params.get('result'), error: params.get('error') };
        }

        function decodeResult(encoded) {
          // base64url -> JSON
          var b64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
          while (b64.length % 4) b64 += '=';
          var json = decodeURIComponent(escape(window.atob(b64)));
          return JSON.parse(json);
        }

        var fragment = parseFragment();
        var payload;

        if (fragment.error) {
          payload = { ok: false, error: decodeURIComponent(fragment.error) };
        } else if (fragment.result) {
          try {
            payload = { ok: true, auth: decodeResult(fragment.result) };
          } catch (e) {
            payload = { ok: false, error: 'Could not read sign-in response.' };
          }
        } else {
          payload = { ok: false, error: 'No sign-in response was returned.' };
        }

        var message = Object.assign({ type: 'oauth-result' }, payload);

        if (window.opener && !window.opener.closed) {
          // Same-origin opener (UI). Target our own origin explicitly.
          window.opener.postMessage(message, window.location.origin);
          messageEl.textContent = payload.ok ? 'Signed in. You can close this window.' : payload.error;
          if (!payload.ok) showError(payload.error);
          // Give the opener a tick to process, then close the popup.
          setTimeout(function () { window.close(); }, payload.ok ? 250 : 2500);
        } else {
          // Opened directly (no popup opener) — fall back to the app.
          if (payload.ok) {
            try {
              sessionStorage.setItem('oauthResult', JSON.stringify(payload.auth));
            } catch (e) {}
            window.location.replace('/');
          } else {
            showError(payload.error);
          }
        }
      })();
    </script>
  </body>
</html>
