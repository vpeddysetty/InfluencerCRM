# =============================================================
# Attribution & Commerce: campaign codes, sale attributions, marketplace connections, daily stats. Highest write volume.
# Extracted context (docs/EXTRACTION-RUNBOOK.md).
# =============================================================
server.port=${ATTRIBUTION_SERVICE_PORT:8448}

# Connects as svc_attribution, NOT influencercrm_user. That role reaches only the
# attribution schema, plus insert on the outbox and read on the tenancy spine, so a query
# against another context's tables fails at the database rather than at review.
spring.datasource.url=${ATTRIBUTION_DB_URL:jdbc:postgresql://localhost:5432/influencercrm_db?stringtype=unspecified}
spring.datasource.username=${ATTRIBUTION_DB_USER:svc_attribution}
spring.datasource.password=${ATTRIBUTION_DB_PASSWORD:change-me-attribution}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# The role's search_path resolves attribution, shared, identity, public, so entities keep
# using unqualified table names.

# Internal service: only the gateway may call it.
attribution.service-token=${ATTRIBUTION_SERVICE_TOKEN:wdZcoE9N3fhGST9heyi4QAXRTiFGWC5jKHhdyl05Pk8}

# The outbox relay runs in whichever service owns the emitting context.
influencrm.events.relay.enabled=${EVENTS_RELAY_ENABLED:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
