# =============================================================
# Campaign Management: campaigns, briefs, spreadsheet import and hydration.
# Extracted context (docs/EXTRACTION-RUNBOOK.md).
# =============================================================
server.port=${CAMPAIGN_SERVICE_PORT:8447}

# Connects as svc_campaign, NOT influencercrm_user. That role reaches only the
# campaign schema, plus insert on the outbox and read on the tenancy spine, so a query
# against another context's tables fails at the database rather than at review.
spring.datasource.url=${CAMPAIGN_DB_URL:jdbc:postgresql://localhost:5432/influencercrm_db?stringtype=unspecified}
spring.datasource.username=${CAMPAIGN_DB_USER:svc_campaign}
spring.datasource.password=${CAMPAIGN_DB_PASSWORD:change-me-campaign}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# The role's search_path resolves campaign, shared, identity, public, so entities keep
# using unqualified table names.

# Internal service: only the gateway may call it.
campaign.service-token=${CAMPAIGN_SERVICE_TOKEN:wdZcoE9N3fhGST9heyi4QAXRTiFGWC5jKHhdyl05Pk8}

# The outbox relay runs in whichever service owns the emitting context.
influencrm.events.relay.enabled=${EVENTS_RELAY_ENABLED:false}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- Cross-context dependencies (now over the wire) ---
# Spreadsheet import creates creators, which the Creator context owns. The port interface is
# unchanged from the monolith; only what stands behind it moved.
campaign.creator-service-url=${CREATOR_SERVICE_URL:http://localhost:8446}
campaign.identity-service-url=${IDENTITY_SERVICE_URL:http://localhost:8445}
