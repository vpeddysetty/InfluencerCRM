# Names this service everywhere it is identified: the log file it appends to on the shared
# EFS directory (influencrm-identity.log), the `service` field on every JSON log line, and
# the metrics tag. The shared logback config in Commons has NO default for this, so a
# missing value fails at startup rather than producing an unattributable log file.
spring.application.name=identity

# =============================================================
# Identity & Access: accounts, brands, memberships, users, refresh tokens. The tenancy spine every other context reads.
# Extracted context (docs/EXTRACTION-RUNBOOK.md).
# =============================================================
server.port=${IDENTITY_SERVICE_PORT:8445}

# Connects as svc_identity, NOT influencercrm_user. That role reaches only the
# identity schema, plus insert on the outbox and read on the tenancy spine, so a query
# against another context's tables fails at the database rather than at review.
spring.datasource.url=${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/influencercrm_db?stringtype=unspecified}
spring.datasource.username=${IDENTITY_DB_USER:svc_identity}
spring.datasource.password=${IDENTITY_DB_PASSWORD:change-me-identity}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# The role's search_path resolves identity, shared, identity, public, so entities keep
# using unqualified table names.

# Internal service: only the gateway may call it.
identity.service-token=${IDENTITY_SERVICE_TOKEN:wdZcoE9N3fhGST9heyi4QAXRTiFGWC5jKHhdyl05Pk8}

# The outbox relay runs in whichever service owns the emitting context.
influencrm.events.relay.enabled=${EVENTS_RELAY_ENABLED:false}

# Mapped from /actuator/health to /health so the path that ServiceTokenFilter#shouldNotFilter and
# the security config ALREADY exempt is the one actuator serves. Without this the only health
# endpoint sits behind the service token, and no orchestrator can present one — /actuator/health
# returned 401, so compose and an ALB target group would both mark a healthy service as failed.
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
