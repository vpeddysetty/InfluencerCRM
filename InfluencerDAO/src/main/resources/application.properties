# Names this service everywhere it is identified: the log file it appends to on the shared
# EFS directory (influencrm-dao.log), the `service` field on every JSON log line, and
# the metrics tag. The shared logback config in Commons has NO default for this, so a
# missing value fails at startup rather than producing an unattributable log file.
spring.application.name=dao

# `localhost` is unreachable from a container — it resolves to the container itself, not the host
# — so these three must be overridable or the DAO cannot find Postgres anywhere but a dev laptop.
# The extracted services (svc_* roles) were already written this way; the DAO was the one left
# hardcoded because it predates them.
#
# In Fargate the password comes from Secrets Manager via the task definition's `secrets` block,
# which sets DAO_DB_PASSWORD in the environment. The default below is local-only.
spring.datasource.url=${DAO_DB_URL:jdbc:postgresql://localhost:5432/influencercrm_db?stringtype=unspecified}
spring.datasource.username=${DAO_DB_USER:influencercrm_user}
spring.datasource.password=${DAO_DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${DAO_PORT:8443}

# The keystore holds a PRIVATE key, so it is gitignored and is not in the image. A container
# therefore has no classpath:keystore.p12 to load and dies at startup unless these are overridden.
# In AWS the keystore is mounted from a secret and DAO_KEYSTORE points at the mounted file
# (e.g. file:/run/secrets/keystore.p12).
#
# The defaults below preserve local development exactly as it was; they are not safe anywhere else,
# and the password default in particular must be overridden in every deployed environment.
server.ssl.key-store=${DAO_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${DAO_KEYSTORE_PASSWORD:password}
server.ssl.key-store-type=${DAO_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${DAO_KEY_ALIAS:influencerdao}

# --- Health endpoint (containerization) ---
# DaoSecurityConfig and both filters already exempt `/health` from the service token — an
# orchestrator cannot present one — but nothing served that path, so it 404'd. Actuator now serves
# it, mapped from the default /actuator/health to /health so the exemptions that already exist keep
# matching and the security config does not have to widen.
#
# EXPOSED DELIBERATELY NARROW: `health` only. Not `env`, `configprops` or `heapdump`, which on this
# service would leak the database password and the service token. This mirrors the BFF's comment on
# the same list.
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health
management.endpoints.web.exposure.include=health
# No details and no components to an unauthenticated caller: liveness is a yes/no, and the
# breakdown would tell anyone who can reach the port which dependencies are down.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Kubernetes-style liveness/readiness groups. Fargate does not use them directly, but readiness
# distinguishes "started" from "can reach its database", which is the distinction an ALB target
# group needs to avoid routing to a task whose connection pool is dead.
management.endpoint.health.probes.enabled=true

# --- Service-to-service authentication (Phase 0) ---
# The DAO is an internal persistence API and must only be reachable by the BFF.
# Must match web-experience.dao-service-token on the BFF. Override via DAO_SERVICE_TOKEN
# in every deployed environment; the default below is for local development only.
dao.service-token=${DAO_SERVICE_TOKEN:wdZcoE9N3fhGST9heyi4QAXRTiFGWC5jKHhdyl05Pk8}

# --- Domain event relay (Phase 5) ---
# Drains the transactional outbox and dispatches to in-process handlers.
# Off by default: a relay that starts polling unprompted (including in tests) is a surprise.
influencrm.events.relay.enabled=${EVENTS_RELAY_ENABLED:true}
influencrm.events.relay.interval-ms=${EVENTS_RELAY_INTERVAL_MS:5000}

# --- Workload identity (step 3) ---
# Verifies the workload tokens the BFF presents. Must match web-experience.workload.signing-key.
#
# DUAL-ACCEPT while this migrates: the DAO prefers a workload token and still accepts the legacy
# dao.service-token, logging a WARN naming the caller each time the old path is used. When those
# warnings stop, the legacy branch is deleted. A hard cutover was rejected because this filter is
# on every request — BFF and DAO would have to deploy in the same instant, with no way to roll back
# one service alone.
dao.workload.signing-key=${DAO_WORKLOAD_SIGNING_KEY:}

# --- Workload identity: asymmetric (preferred) ---
# The BFF's Ed25519 PUBLIC key. Verification only — the DAO cannot mint with it, so reading this
# config gives an attacker nothing. That is the whole point of moving off the shared secret above.
dao.workload.trust.web-experience=${DAO_WORKLOAD_TRUST_WEBE:}

# --- Tenant scoping (closes the optional-brandId IDOR) ---
# When true, a tenant-scoped GET/DELETE that supplies neither a brandId nor a signed tenant is
# refused with 400 instead of falling through to findAll() and returning every customer's rows.
#
# OFF BY DEFAULT because enabling it refuses requests that work today — that has to be a deliberate
# act, not something a deploy brings with it. Turn it on once
# dao.workload.trust.web-experience is set and the "Tenant-scoped request with no brand" WARN lines
# have gone quiet; those lines are the inventory of what would break.
dao.tenancy.require-scope=${DAO_REQUIRE_TENANT_SCOPE:false}
