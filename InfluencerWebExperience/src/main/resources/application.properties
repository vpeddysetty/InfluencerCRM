server.port=8081

web-experience.dao-base-url=https://localhost:8443
web-experience.agent-base-url=http://localhost:8000
# Origin of the React UI.
web-experience.ui-base-url=${WEBE_UI_BASE_URL:http://localhost:5173}
# Origin of the Digital Presentation Service. The OAuth callback hands the completed sign-in here,
# so the tokens become an httpOnly cookie session instead of travelling back through the browser.
web-experience.dps-base-url=${WEBE_DPS_BASE_URL:http://localhost:8090}
# Own origin, used to build the provider redirect URIs below.
web-experience.public-base-url=${WEBE_PUBLIC_BASE_URL:http://localhost:8081}
web-experience.session-ttl-minutes=720
# Provider credentials come from the environment (never commit real secrets).
# For local dev, set them in application-local.properties (git-ignored) or as env vars.
web-experience.oauth.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
web-experience.oauth.google.token-uri=https://oauth2.googleapis.com/token
web-experience.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:replace-me}
web-experience.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:replace-me}
# Must EXACTLY match the redirect URI registered in Google Cloud Console.
# Points at the BFF itself, not the UI origin: the callback is a BFF endpoint, and routing it
# through the UI made a provider redirect depend on the dev server's proxy being up.
web-experience.oauth.google.redirect-uri=${WEBE_PUBLIC_BASE_URL:http://localhost:8081}/api/auth/oauth/google/callback
web-experience.oauth.google.userinfo-uri=https://www.googleapis.com/oauth2/v3/userinfo
web-experience.oauth.facebook.authorization-uri=https://www.facebook.com/v20.0/dialog/oauth
web-experience.oauth.facebook.token-uri=https://graph.facebook.com/v20.0/oauth/access_token
web-experience.oauth.facebook.client-id=${FACEBOOK_OAUTH_CLIENT_ID:replace-me}
web-experience.oauth.facebook.client-secret=${FACEBOOK_OAUTH_CLIENT_SECRET:replace-me}
# Must EXACTLY match the redirect URI registered in Meta for Developers.
web-experience.oauth.facebook.redirect-uri=${WEBE_PUBLIC_BASE_URL:http://localhost:8081}/api/auth/oauth/facebook/callback
web-experience.oauth.facebook.userinfo-uri=https://graph.facebook.com/me?fields=id,name,email

# --- Phase 0 security ---
# Access tokens are short-lived and verified by signature alone; refresh tokens are revocable.
web-experience.access-token-ttl-minutes=${WEBE_ACCESS_TOKEN_TTL_MINUTES:30}
web-experience.refresh-token-ttl-minutes=${WEBE_REFRESH_TOKEN_TTL_MINUTES:43200}
# RSA JWK (JSON, including the private key) used to sign access tokens. When unset an ephemeral
# key is generated at startup: tokens then die on restart and cannot be verified by a second
# instance. Acceptable locally; set WEBE_JWT_SIGNING_KEY in every deployed environment.
web-experience.jwt-signing-key=${WEBE_JWT_SIGNING_KEY:}
# Shared credential presented to the DAO. Must match dao.service-token on the DAO.
web-experience.dao-service-token=${DAO_SERVICE_TOKEN:wdZcoE9N3fhGST9heyi4QAXRTiFGWC5jKHhdyl05Pk8}
# TLS verification for BFF -> DAO calls. The DAO uses a self-signed certificate locally, so point
# dao-trust-store at it rather than disabling verification. Setting this to false accepts ANY
# certificate and must never be used outside local development.
web-experience.dao-tls-verification-enabled=${WEBE_DAO_TLS_VERIFICATION:true}
web-experience.dao-trust-store=${WEBE_DAO_TRUST_STORE:classpath:dao-truststore.p12}
web-experience.dao-trust-store-password=${WEBE_DAO_TRUST_STORE_PASSWORD:changeit}

# --- Workflow service extraction (first extracted context) ---
# Off by default: the monolith DAO still serves Workflow until the extracted service
# has been dual-run and soaked. Flipping this is the cutover, and flipping it back is
# the rollback — seconds either way, no redeploy.
web-experience.workflow-service-enabled=${WORKFLOW_SERVICE_ENABLED:false}
web-experience.workflow-service-base-url=${WORKFLOW_SERVICE_URL:http://localhost:8444}
web-experience.workflow-service-token=${WORKFLOW_SERVICE_TOKEN:wdZcoE9N3fhGST9heyi4QAXRTiFGWC5jKHhdyl05Pk8}

# --- Key rotation ---
# Public JWKs of rotated-out keys, comma-separated. Still trusted for verification so a rotation
# does not invalidate tokens already in flight. Remove an entry once the access-token TTL has
# elapsed since the rotation. See docs/keystore-rotation.md.
web-experience.jwt-previous-keys=${WEBE_JWT_PREVIOUS_KEYS:}
