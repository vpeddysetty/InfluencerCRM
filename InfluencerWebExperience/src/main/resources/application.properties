# Names this service everywhere it is identified: the log file it appends to on the shared
# EFS directory (influencrm-web-experience.log), the `service` field on every JSON log line, and
# the metrics tag. The shared logback config in Commons has NO default for this, so a
# missing value fails at startup rather than producing an unattributable log file.
spring.application.name=web-experience

server.port=${WEBE_PORT:8081}

# Both of these were hardcoded to localhost, which no container can reach. In compose and in
# Fargate they resolve by service-discovery name (e.g. https://dao:8443) instead.
#
# The DAO URL stays https: the BFF verifies the DAO's certificate against dao-trust-store below,
# and that mTLS-style check is the zero-trust chain's inner hop. Downgrading it to http here would
# silently disable that verification rather than fail.
web-experience.dao-base-url=${WEBE_DAO_BASE_URL:https://localhost:8443}
web-experience.agent-base-url=${WEBE_AGENT_BASE_URL:http://localhost:8000}
# Origin of the React UI.
web-experience.ui-base-url=${WEBE_UI_BASE_URL:http://localhost:5173}
# Origin of the Digital Presentation Service. The OAuth callback hands the completed sign-in here,
# so the tokens become an httpOnly cookie session instead of travelling back through the browser.
web-experience.dps-base-url=${WEBE_DPS_BASE_URL:http://localhost:8090}
# Own origin, used to build the provider redirect URIs below.
web-experience.public-base-url=${WEBE_PUBLIC_BASE_URL:http://localhost:8081}
web-experience.session-ttl-minutes=720
# Provider credentials come from the environment (never commit real secrets).
# For local dev, set them in application-local.properties (git-ignored) or as env vars.
web-experience.oauth.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
web-experience.oauth.google.token-uri=https://oauth2.googleapis.com/token
web-experience.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:replace-me}
web-experience.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:replace-me}
# Must EXACTLY match the redirect URI registered in Google Cloud Console.
# Points at the BFF itself, not the UI origin: the callback is a BFF endpoint, and routing it
# through the UI made a provider redirect depend on the dev server's proxy being up.
web-experience.oauth.google.redirect-uri=${WEBE_PUBLIC_BASE_URL:http://localhost:8081}/api/auth/oauth/google/callback
web-experience.oauth.google.userinfo-uri=https://www.googleapis.com/oauth2/v3/userinfo
web-experience.oauth.facebook.authorization-uri=https://www.facebook.com/v20.0/dialog/oauth
web-experience.oauth.facebook.token-uri=https://graph.facebook.com/v20.0/oauth/access_token
web-experience.oauth.facebook.client-id=${FACEBOOK_OAUTH_CLIENT_ID:replace-me}
web-experience.oauth.facebook.client-secret=${FACEBOOK_OAUTH_CLIENT_SECRET:replace-me}
# Must EXACTLY match the redirect URI registered in Meta for Developers.
web-experience.oauth.facebook.redirect-uri=${WEBE_PUBLIC_BASE_URL:http://localhost:8081}/api/auth/oauth/facebook/callback
web-experience.oauth.facebook.userinfo-uri=https://graph.facebook.com/me?fields=id,name,email
# Requires a CONSUMER-type Meta app. A Business-type app uses Facebook Login for Business, where
# config_id REPLACES scope — a scope parameter is then rejected with "Invalid Scopes: email"
# whatever it contains, so no permission list fixes it. Instagram needs a Business app, but that is
# a separate integration (M6) on its own app. See docs/platform-app-registration.md.
web-experience.oauth.facebook.scope=${FACEBOOK_OAUTH_SCOPE:email,public_profile}

# --- Phase 0 security ---
# Access tokens are short-lived and verified by signature alone; refresh tokens are revocable.
web-experience.access-token-ttl-minutes=${WEBE_ACCESS_TOKEN_TTL_MINUTES:30}
web-experience.refresh-token-ttl-minutes=${WEBE_REFRESH_TOKEN_TTL_MINUTES:43200}
# RSA JWK (JSON, including the private key) used to sign access tokens. When unset an ephemeral
# key is generated at startup: tokens then die on restart and cannot be verified by a second
# instance. Acceptable locally; set WEBE_JWT_SIGNING_KEY in every deployed environment.
web-experience.jwt-signing-key=${WEBE_JWT_SIGNING_KEY:}
# Shared credential presented to the DAO. Must match dao.service-token on the DAO.
web-experience.dao-service-token=${DAO_SERVICE_TOKEN:wdZcoE9N3fhGST9heyi4QAXRTiFGWC5jKHhdyl05Pk8}
# TLS verification for BFF -> DAO calls. The DAO uses a self-signed certificate locally, so point
# dao-trust-store at it rather than disabling verification. Setting this to false accepts ANY
# certificate and must never be used outside local development.
web-experience.dao-tls-verification-enabled=${WEBE_DAO_TLS_VERIFICATION:true}
web-experience.dao-trust-store=${WEBE_DAO_TRUST_STORE:classpath:dao-truststore.p12}
web-experience.dao-trust-store-password=${WEBE_DAO_TRUST_STORE_PASSWORD:changeit}

# --- Workflow service extraction (first extracted context) ---
# Off by default: the monolith DAO still serves Workflow until the extracted service
# has been dual-run and soaked. Flipping this is the cutover, and flipping it back is
# the rollback — seconds either way, no redeploy.
web-experience.workflow-service-enabled=${WORKFLOW_SERVICE_ENABLED:false}
web-experience.workflow-service-base-url=${WORKFLOW_SERVICE_URL:http://localhost:8444}
web-experience.workflow-service-token=${WORKFLOW_SERVICE_TOKEN:wdZcoE9N3fhGST9heyi4QAXRTiFGWC5jKHhdyl05Pk8}

# --- Key rotation ---
# Public JWKs of rotated-out keys, comma-separated. Still trusted for verification so a rotation
# does not invalidate tokens already in flight. Remove an entry once the access-token TTL has
# elapsed since the rotation. See docs/keystore-rotation.md.
web-experience.jwt-previous-keys=${WEBE_JWT_PREVIOUS_KEYS:}

# --- External provider selection (M0.4) ---
# Both of these were previously UNSET, and both mocks activate via `matchIfMissing = true`.
# The mocks were therefore the default with no configuration expressing that choice — an accident
# that looked identical to a decision. Writing `mock` down changes nothing at runtime today and
# makes the next change deliberate: swapping a provider is now editing a value, not discovering
# that a value was never there.
#
# `dns` performs a real TXT lookup at _influencrm-verify.<domain> and is the default (M5.4).
#
# It replaces `mock`, whose "verification" was a substring check passing for any domain not
# containing the literal string `unverified` — INCLUDING domains the caller does not own. That
# mock is still available for tests but must now be asked for by name: it no longer carries
# matchIfMissing, so an environment that forgets this property gets the real check rather than a
# registrar that agrees a brand owns google.com.
#
# `mock` remains correct for automated tests and offline demos. It is never correct for anything
# a customer touches.
web-experience.domains.provider=${WEBE_DOMAINS_PROVIDER:dns}

# How long a single DNS lookup may take, and how many times to retry. Bounded because the lookup
# happens on a request thread: an unreachable resolver would otherwise hang the verify endpoint.
web-experience.domains.dns-timeout-ms=${WEBE_DNS_TIMEOUT_MS:3000}
web-experience.domains.dns-retries=${WEBE_DNS_RETRIES:1}
web-experience.creators.social-provider=${WEBE_SOCIAL_PROVIDER:mock}

# --- AI campaign-page generation (PR-35) ---
# Which generator turns a campaign brief into landing page drafts.
#
# `template` composes the drafts deterministically with no network call. Unlike the other
# providers here, the default is NOT a no-op: a page builder that returns nothing leaves the user
# staring at the blank canvas the whole feature exists to remove. So the safe default produces a
# real, publishable page from the brief — just without a model writing the copy.
#
# `anthropic` is the model-backed generator. It is also the failure path's opposite number: when
# it cannot produce usable drafts the service substitutes `template` and marks the response
# `fallback: true`, so the UI can say plainly which one the user is looking at. A template draft
# presented as an AI draft is worse than one that admits what it is.
#
# Selecting `anthropic` without an api-key below does not fail at call time — the bean is
# @ConditionalOnProperty-gated and simply never exists, so the registry resolves to `template`.
web-experience.landing.generation.provider=${WEBE_PAGE_GENERATION_PROVIDER:template}

# Only read when generation.provider=anthropic. Blank is the shipped state.
web-experience.landing.generation.api-key=${WEBE_PAGE_GENERATION_API_KEY:}
web-experience.landing.generation.model=${WEBE_PAGE_GENERATION_MODEL:claude-opus-5}

# Generating three drafts routinely exceeds the 10s shared outbound default, which is tuned for
# social-profile lookups. Set per-call rather than raising that global value, which would also let
# a hung social API hold a request thread twelve times as long.
web-experience.landing.generation.timeout-ms=${WEBE_PAGE_GENERATION_TIMEOUT_MS:120000}
# PR-39: `web-experience.landing.editor` is removed. It chose between the curated section
# editor and the GrapesJS builder; the builder is deleted from the bundle, so the flag had one
# possible value left and a rollback path that no longer existed.

# --- Scheduled landing page publish (PR-35) ---
# Publishes pages whose scheduled time has arrived. OFF by default, like the expiry-warning sweep
# and the outbox relay: a job that publishes customer pages the moment anyone starts the
# application — including from a developer's machine pointed at a shared database — is a bad
# surprise. Switched on deliberately in the environment that owns the data.
#
# The sweep goes through LandingStageService, so it inherits the empty-page guard, the stage
# machine, the transition audit row, the board sync and the hosting-window clock. It never writes
# status directly.
#
# OP-17 applies: plain @Scheduled with no ShedLock, so a second instance double-publishes. Harmless
# relative to double-sent email (the second transition is a no-op once the stage is `published`),
# but the same multi-instance prerequisite in roadmap §7.2 holds before the HA flag is flipped.
web-experience.landing.scheduled-publish.enabled=${WEBE_SCHEDULED_PUBLISH_ENABLED:false}

# Every minute. The UI offers minute granularity, so sweeping more often spends DAO calls to gain
# nothing a user could perceive.
web-experience.landing.scheduled-publish.interval-ms=${WEBE_SCHEDULED_PUBLISH_INTERVAL_MS:60000}
web-experience.landing.scheduled-publish.initial-delay-ms=${WEBE_SCHEDULED_PUBLISH_INITIAL_DELAY_MS:60000}

# --- Social platform adapters (M6) ---
# Lookups now route per platform through SocialPlatformRegistry. An adapter answers only when it
# reports isConfigured(); otherwise the lookup falls back to the simulation, and the creator row
# records source=mock either way. Nothing here can make a simulated number claim to be real.
#
# YouTube is the one platform needing no app review — a server API key, already obtained (M0.1).
# Set it and YouTube creators get genuine subscriber counts with source=platform_api. Left blank,
# the adapter reports itself unconfigured and YouTube stays simulated like the others.
web-experience.creators.youtube-api-key=${YOUTUBE_API_KEY:}

# Instagram reads through business_discovery, which needs BOTH a long-lived token and the id of the
# Business account the call travels through. Neither implies the other, and the adapter reports
# itself unconfigured unless both are set — so a half-configured deployment falls back to the
# simulation rather than returning nulls for every Instagram creator.
#
# The token is long-lived (60 days) but NOT permanent: it must be refreshed before expiry or
# Instagram lookups silently revert to simulated numbers. There is no code that refreshes it yet.
web-experience.creators.instagram-access-token=${INSTAGRAM_ACCESS_TOKEN:}
web-experience.creators.instagram-business-account-id=${INSTAGRAM_BUSINESS_ACCOUNT_ID:}

# The handle the token above belongs to. A lookup of THIS handle reads the connected account
# directly; every other handle goes through business_discovery.
#
# Set it because business_discovery is gated on Advanced Access and answers (#10) for every target
# while the app is in review — including our own account. Without this the adapter returns null for
# everything, and there is no way to demonstrate the integration to the reviewer who would grant
# the access. Both paths return real data and report platform_api; only the endpoint differs.
#
# Blank means "no self-account known" and routes everything to discovery, which is the safe default:
# a wrong match here would read our own metrics and label them as another creator's.
web-experience.creators.instagram-own-username=${INSTAGRAM_OWN_USERNAME:}

# TikTok stays simulated until registration is submitted. Flip to false once a real adapter exists;
# that hands the platform over without deleting the simulated one, so a rollback is a config change
# rather than a revert.
web-experience.creators.tiktok-simulated=${WEBE_TIKTOK_SIMULATED:true}

# --- Outbound HTTP (M6.1) ---
# Bounded because these calls happen on a request thread: a platform that stops responding must
# not hold one open indefinitely.
web-experience.outbound.connect-timeout-ms=${WEBE_OUTBOUND_CONNECT_MS:5000}
web-experience.outbound.request-timeout-ms=${WEBE_OUTBOUND_REQUEST_MS:10000}

# CNAME target that brands are told to point their domain at. The default below is an RFC 2606
# reserved name that CANNOT RESOLVE — deliberately, so nothing appears to work when it does not.
#
# M5.1 note (verified 2026-08-07): the decided target is `pages.tejdux.com`
# (docs/infrastructure/hosting-topology-decision.md), but that name DOES NOT RESOLVE YET — no DNS
# record exists for it, while www.tejdux.com resolves to CloudFront. Setting this to a
# not-yet-provisioned hostname would be WORSE than the reserved name: both fail, but a plausible
# name fails silently and looks configured, whereas a .example name is recognisable as a
# placeholder. So this stays until the deployment exists.
#
# To finish M5.1, in this order:
#   1. Create the `*.pages.tejdux.com` DNS record pointing at the CloudFront distribution
#   2. Issue the ACM wildcard certificate for `*.pages.tejdux.com` (us-east-1, CloudFront requires it)
#   3. Set WEBE_HOSTING_TARGET=pages.tejdux.com
# Until step 3, DnsDomainRegistrar logs a WARN at startup and omits the CNAME line from the
# instructions rather than handing a brand a record that points at nothing.
web-experience.domains.hosting-target=${WEBE_HOSTING_TARGET:pages.influencrm.example}

# --- Email verification ---
# Whether an unverified password account is REFUSED at sign-in. Default false.
#
# This gates enforcement only. Challenges are created and emailed regardless of this setting, so
# the path runs from the day it ships rather than lying dormant - a feature that is entirely inert
# until a flag flips is one nobody has ever executed.
#
# Turn it on only once a real activation email has been seen to arrive in a real inbox. With a
# broken sender, enforcement locks every new signup out permanently: the account exists, the
# password works, and the only way in is a link that was never delivered.
#
# Federated sign-ins (Google, Facebook) are never blocked by this - the provider already proved
# the address, and EmailVerificationPolicy treats that as sufficient.
web-experience.email-verification.enforced=${WEBE_EMAIL_VERIFICATION_ENFORCED:false}

# --- Subscriptions and billing (M2.1/M2.2) ---
# Which BillingProvider handles new subscriptions. `manual` records a subscription and takes NO
# money — it reports chargesMoney=false everywhere so an unpaid account can never be presented as
# a paid one, and it logs at WARN every time it is used. Set to `stripe` when an adapter and keys
# exist. An unknown value falls back to `manual` rather than failing open.
web-experience.billing.provider=${WEBE_BILLING_PROVIDER:manual}
#
# Webhook signing secret. UNSET BY DEFAULT, and the webhook endpoint is DISABLED (503) while it is
# empty. That endpoint has to be unauthenticated — a payment provider holds no user token — so the
# signature IS the authentication: without it, anyone who knows the URL could POST a
# subscription.updated and move their account onto the agency plan for nothing.
web-experience.billing.webhook-secret=${WEBE_BILLING_WEBHOOK_SECRET:}

# --- Stripe (only read when billing.provider=stripe) ---
# NEVER commit real keys. Put them in application-local.properties (git-ignored) or export the env
# vars below. A test-mode key (sk_test_…) is detected automatically and logged loudly at startup,
# so a sandbox deployment can never be mistaken for one taking real money.
#
# The adapter needs BOTH a secret key and at least one price id: a key alone cannot start a
# subscription to anything, so it reports itself unconfigured and the registry falls back to
# `manual`, which announces that it takes nothing.
web-experience.billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
# Price ids from your Stripe product catalogue (price_…), NOT amounts. The number lives in Stripe,
# which is the thing that actually charges — a price duplicated here could disagree with it, and
# the customer's card would be the tiebreaker.
web-experience.billing.stripe.price-pro=${STRIPE_PRICE_PRO:}
web-experience.billing.stripe.price-agency=${STRIPE_PRICE_AGENCY:}
# Annual equivalents. Leaving one blank means that plan cannot be bought yearly - checkout says so
# rather than falling back to monthly, which would charge a different amount than was chosen.
web-experience.billing.stripe.price-pro-yearly=${STRIPE_PRICE_PRO_YEARLY:}
web-experience.billing.stripe.price-agency-yearly=${STRIPE_PRICE_AGENCY_YEARLY:}

# Free-trial length in days, PER PLAN. 0 disables the trial for that plan.
# Stripe owns the clock: it ends the trial itself and emits customer.subscription.updated, which
# the billing webhook applies. Only the Stripe adapter offers trials for exactly that reason - the
# manual provider emits nothing, so a trial under it would never end, and SubscriptionService
# refuses to open one there however these are set.
#
# Agency carries a trial and Pro does not, deliberately: the free tier allows ONE brand, so a
# multi-client agency cannot evaluate the product that matters to them without a trial, while a
# single-brand Pro buyer can.
web-experience.billing.stripe.trial-days-pro=${STRIPE_TRIAL_DAYS_PRO:0}
web-experience.billing.stripe.trial-days-agency=${STRIPE_TRIAL_DAYS_AGENCY:30}

# --- Marketplace credential encryption (M3.1) ---
# Key-encryption key for envelope-encrypting marketplace credentials. UNSET BY DEFAULT, and while it
# is empty any provider that handles real credentials REFUSES TO CONNECT — checked before the
# handshake, so no live grant is created that this system then cannot record.
#
# The alternative was to encrypt when a key is present and write plaintext when it is not, so
# development "just works". That fallback is the incident: it is silent, it looks configured, and
# the one deployment where this variable was missed is the one holding real store tokens. The mock
# provider is exempt (it declares usesRealCredentials=false), so local work needs no key at all.
#
# Generate one:  openssl rand -base64 32
# NEVER commit it. Use application-local.properties (git-ignored) or the env var.
web-experience.marketplace.credential-key=${WEBE_MARKETPLACE_CREDENTIAL_KEY:}
# Recorded inside every blob so a rotation can tell which rows still use the old key. Change this
# together with the key above; rows re-encrypt as their connections are next saved.
web-experience.marketplace.credential-key-id=${WEBE_MARKETPLACE_CREDENTIAL_KEY_ID:default}

# --- Hosting expiry warnings (M5.6) ---
# Warns a brand at 30, 7 and 1 days before free hosting ends. Before this, a published page simply
# stopped serving one day with no warning — the window and the extend endpoint existed, but nothing
# ever told anyone the clock was running.
#
# OFF by default, like the event relay: a job that starts emailing the moment anyone runs the app —
# from a test, or a developer pointed at a shared database — is a bad surprise. Turn it on in the
# environment that owns sending.
#
# It also needs a real email provider below. With the default `log` provider the sweep runs, marks
# pages as warned, and sends nothing to anyone.
web-experience.hosting.expiry-warnings.enabled=${WEBE_EXPIRY_WARNINGS:false}
# Daily. More often sends nothing extra — the sent-threshold marker makes a second run in the same
# day a no-op — and only spends DAO calls.
web-experience.hosting.expiry-warnings.interval-ms=${WEBE_EXPIRY_WARNINGS_INTERVAL_MS:86400000}
# Delayed past startup so a restart loop cannot turn into a mail loop, and so the sweep is not
# competing with request traffic while the app is still warming.
web-experience.hosting.expiry-warnings.initial-delay-ms=${WEBE_EXPIRY_WARNINGS_DELAY_MS:60000}

# --- Transactional email (M1.3) ---
# Declared once, with the SES settings it belongs beside — see "Email delivery" further down.
# `log` writes the message to the application log and sends nothing, so the invitation flow, welcome
# emails and expiry warnings can be built and tested without a provider account — the same role
# FilesystemAssetStorage plays for assets. Every send logs at WARN with "NOT SENT".

# --- Asset storage ---
# Uploaded landing-page assets. The adapter's own default is `./asset-store`, which resolves against
# the working directory — /app in the image, owned by root and NOT writable by the non-root runtime
# user. The BFF then failed to start with AccessDeniedException, so this needs an explicit,
# writable, MOUNTED path rather than a relative one.
#
# /mnt/assets, not /mnt/logs: both are EFS in the deployed setup, but they are different lifecycles.
# Logs roll and are capped at 3GB per service; assets must never be deleted by a rolling policy.
#
# It has to be a mount rather than container-local disk for the reason the adapter's own javadoc
# gives: files land on one machine's disk, so a second instance would not see them — and in Fargate
# a container's own filesystem does not survive the task at all, so an upload would vanish on the
# next deploy. S3AssetStorage takes over by configuration when it exists; until then this is the
# path that makes uploads durable.
web-experience.assets.filesystem.root=${WEBE_ASSET_ROOT:./asset-store}

# S3AssetStorage (PR-45). Selected with `web-experience.assets.provider=s3`; the filesystem adapter
# stays the default because it is what local development and CI can run without credentials.
#
# WHAT THIS BUYS, stated honestly: not durability -- /mnt/assets is already an EFS access point, so
# uploads survive an instance refresh today. It buys bytes served by S3/CloudFront instead of
# through the BFF's request threads, an origin Meta's Content Publishing API can fetch server-side
# (roadmap section 10.3 calls object storage a PRECONDITION of that path), and a host for PR-59's
# og:image.
#
# public-base-url is what a BROWSER fetches from and is separate from the bucket, because the two
# differ the moment CloudFront is in front. Left blank it falls back to the bucket endpoint, so a
# deployment without a distribution still serves working images.
#
# The bucket must be publicly readable, or fronted by a distribution that is: these URLs are
# embedded in PUBLIC landing pages, so a signed URL would expire while the page still referenced it.
# Nothing private may be stored through this port.
web-experience.assets.provider=${WEBE_ASSETS_PROVIDER:filesystem}
web-experience.assets.s3.bucket=${WEBE_ASSETS_S3_BUCKET:}
web-experience.assets.s3.region=${WEBE_ASSETS_S3_REGION:us-east-1}
web-experience.assets.s3.access-key-id=${WEBE_ASSETS_S3_ACCESS_KEY_ID:}
web-experience.assets.s3.secret-access-key=${WEBE_ASSETS_S3_SECRET_ACCESS_KEY:}
web-experience.assets.s3.session-token=${WEBE_ASSETS_S3_SESSION_TOKEN:}
web-experience.assets.s3.public-base-url=${WEBE_ASSETS_S3_PUBLIC_BASE_URL:}

# --- Observability (Phase H) ---
# The platform had no metrics and no error tracking at all. This is the first step: an
# in-process registry and a health endpoint, needing no external account or egress.
#
# EXPOSED DELIBERATELY NARROW. `health` and `metrics` only — not `env`, `beans`,
# `configprops` or `heapdump`, which leak configuration (including secret NAMES and, for
# heapdump, their values). Widening this list should be a deliberate act, not the default.
# `prometheus` is deliberately absent: the micrometer-registry-prometheus dependency is not
# added yet, and listing an endpoint that does not exist invites someone to conclude scraping
# works when it silently 404s. Add the dependency and this name together.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized
# A separate port keeps operational endpoints off the public-facing one, so exposing the app
# does not expose its internals by the same route.
management.server.port=${MANAGEMENT_PORT:9081}
# Tag every metric with the service, so one scrape target can hold several services without
# their counters colliding.
management.metrics.tags.service=web-experience

# --- Workload identity (step 3/4) ---
# Shared HMAC key for the short-lived, audience-scoped tokens this service presents to the DAO.
# UNSET BY DEFAULT: without it the BFF sends only the legacy X-Service-Token and the DAO logs a
# WARN on every call. Set it here AND as dao.workload.signing-key to the same value.
#
# Symmetric to start, so no key-distribution service is needed. It is still a decisive improvement
# on a static secret — minutes-long expiry, a named issuer, an audience that stops replay against
# another service, and a SIGNED tenant id, which is what closes the optional-brandId IDOR. Any
# holder can also mint, so per-service signing keys with public verification are the next step.
#
# Generate:  openssl rand -base64 48
web-experience.workload.signing-key=${WEBE_WORKLOAD_SIGNING_KEY:}
# Verifies the DPS's workload token (step 4). Must match dps.workload.signing-key.
# Optional: when unset the BFF accepts calls without it, which is current behaviour. Setting it
# makes "the DPS relayed this" a checkable fact rather than an assumption.
web-experience.workload.dps-key=${WEBE_WORKLOAD_DPS_KEY:}

# --- Workload identity: asymmetric (preferred) ---
# Ed25519 PRIVATE key this service signs with. With it set, tokens are v2 and a verifier holding
# only the public half CANNOT mint — which is the substantive difference from the shared HMAC key
# above, where every verifier is also a forger.
#
# Generate a pair:
#   java -cp InfluencerPlatformCommons.jar \
#        com.influencer.platform.workload.WorkloadKeyPairGenerator web-experience
#
# NEVER commit the private key. The public half is not a secret.
web-experience.workload.private-key=${WEBE_WORKLOAD_PRIVATE_KEY:}
# Public key of the DPS, so this service can verify calls it relays. Add an issuer here only when
# it should be allowed to call this service — it is a trust decision and belongs in a diff.
web-experience.workload.trust.dps=${WEBE_WORKLOAD_TRUST_DPS:}

# --- Email delivery ---
# `log` writes messages to the application log and SENDS NOTHING. Correct locally; in a deployed
# environment it means invitations and expiry warnings reach nobody, which is why LoggingEmailSender
# logs at WARN. Set to `ses` in production.
web-experience.email.provider=${WEBE_EMAIL_PROVIDER:log}
# The From address. MUST be a verified SES identity — SES rejects anything else outright, so a
# deployment with keys but no verified sender fails every send while looking configured.
#
# This default is load-bearing, not decorative. It was previously declared twice in this file: once
# here as blank and once earlier as no-reply@tejdux.com. Spring takes the LAST declaration, so the
# blank one won, isConfigured() returned false, and SES silently sent nothing while every other
# setting looked correct. One declaration only — do not reintroduce a second.
web-experience.email.from=${WEBE_EMAIL_FROM:no-reply@tejdux.com}

# --- Amazon SES (only read when email.provider=ses) ---
# NEVER commit real keys. Use application-local.properties (git-ignored) or the env vars.
# Prefer an IAM user restricted to ses:SendEmail on the one verified identity — these credentials
# can send mail as your domain, and nothing else should be reachable with them.
web-experience.email.ses.access-key-id=${AWS_SES_ACCESS_KEY_ID:}
web-experience.email.ses.secret-access-key=${AWS_SES_SECRET_ACCESS_KEY:}
# Only for temporary credentials from an assumed role; leave blank for a long-lived IAM user.
web-experience.email.ses.session-token=${AWS_SES_SESSION_TOKEN:}
# SES is regional and identities are verified PER REGION. This does not have to match CloudFront.
web-experience.email.ses.region=${AWS_SES_REGION:us-east-1}
# Optional but recommended in production: routes bounce and complaint events back to you. Without
# it a hard bounce is invisible here, and repeated sends to a dead address damage sending
# reputation until SES throttles the account.
web-experience.email.ses.configuration-set=${AWS_SES_CONFIGURATION_SET:}

# --- Consent evidence -------------------------------------------------------
# The published versions of the two legal documents, and where they are published.
#
# These four move TOGETHER. The recorded consent must name the revision the person was shown AND
# where they read it: a version string on its own cannot be resolved back to text once a document
# moves, and a URL on its own cannot say which revision was served from it. When a policy is
# republished, bump the version and check the URL in the same change.
web-experience.legal.terms-version=${WEBE_LEGAL_TERMS_VERSION:2026-08-11}
web-experience.legal.privacy-version=${WEBE_LEGAL_PRIVACY_VERSION:2026-08-23}
web-experience.legal.terms-url=${WEBE_LEGAL_TERMS_URL:https://www.tejdux.com/terms/}
web-experience.legal.privacy-url=${WEBE_LEGAL_PRIVACY_URL:https://www.tejdux.com/privacy/}

# Where the accepted bytes and the per-acceptance receipts are stored.
#
# EMPTY BY DEFAULT, and that is the right default for a laptop: consent is still recorded in
# Postgres, just with no hash. Local development has no bucket, no instance role, and no business
# writing seven-year immutable objects.
#
# The production bucket has Object Lock in COMPLIANCE mode. Nothing written there can be deleted or
# overwritten by anyone for seven years, which is why the writer refuses empty content and hashes
# what it sends.
web-experience.consent.evidence.bucket=${WEBE_CONSENT_EVIDENCE_BUCKET:}
web-experience.consent.evidence.region=${WEBE_CONSENT_EVIDENCE_REGION:us-east-1}
# Only for static credentials. On EC2 the instance role is used automatically and these stay blank.
web-experience.consent.evidence.access-key-id=${WEBE_CONSENT_EVIDENCE_ACCESS_KEY_ID:}
web-experience.consent.evidence.secret-access-key=${WEBE_CONSENT_EVIDENCE_SECRET_ACCESS_KEY:}
web-experience.consent.evidence.session-token=${WEBE_CONSENT_EVIDENCE_SESSION_TOKEN:}
