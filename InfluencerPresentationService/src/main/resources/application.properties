# Names this service everywhere it is identified: the log file it appends to on the shared
# EFS directory (influencrm-dps.log), the `service` field on every JSON log line, and
# the metrics tag. The shared logback config in Commons has NO default for this, so a
# missing value fails at startup rather than producing an unattributable log file.
spring.application.name=dps

# =============================================================
# Digital Presentation Service (DPS)
# The authentication and authorization entry point for every micro-frontend origin.
# =============================================================
server.port=${DPS_PORT:8090}

# The DPS brokers through the BFF rather than calling Identity directly: the BFF already owns
# token issuance, brand resolution and the permission matrix, and a second implementation of
# any of those could disagree with the first.
dps.bff-base-url=${DPS_BFF_URL:http://localhost:8081}
# The BROWSER-facing BFF address, used for OAuth redirects. Distinct from dps.bff-base-url, which is
# the internal server-to-server one; see DpsProperties for why conflating them broke Google sign-in.
# The localhost default is correct for development only — deployments MUST set DPS_PUBLIC_BFF_URL.
dps.public-bff-base-url=${DPS_PUBLIC_BFF_URL:http://localhost:8081}
dps.service-token=${DPS_SERVICE_TOKEN:wdZcoE9N3fhGST9heyi4QAXRTiFGWC5jKHhdyl05Pk8}

# Where the OAuth flow returns the user after signing in. The session cookie is set on that
# redirect, so the shell is already authenticated when it loads.
dps.ui-base-url=${DPS_UI_BASE_URL:http://localhost:5173}

# Every micro-frontend origin must be listed. A wildcard is not permitted alongside
# allow-credentials, and credentials are exactly what carries the session cookie.
dps.allowed-origins=${DPS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179}

# Sliding session lifetime: activity extends it, idleness ends it.
dps.session-ttl-minutes=${DPS_SESSION_TTL_MINUTES:480}
dps.max-sessions=${DPS_MAX_SESSIONS:50000}

dps.cookie-name=${DPS_COOKIE_NAME:INFLUENCRM_SESSION}
# Secure cookies are never sent over plain HTTP, so this stays off for local development and
# MUST be enabled in any deployed environment.
dps.cookie-secure=${DPS_COOKIE_SECURE:false}
# Cross-origin micro-frontends need SameSite=None, which the spec only permits alongside Secure.
# Lax is correct while everything is same-site in development.
dps.cookie-same-site=${DPS_COOKIE_SAME_SITE:Lax}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# Spring's Redis health indicator auto-activates whenever spring-data-redis is on the classpath —
# which it always is here, because RedisSessionStore is a compile-time option. So with
# dps.session-store unset (in-memory Caffeine, the correct choice for a single instance) the DPS
# reported status DOWN for a Redis it deliberately does not use: it started fine and served traffic,
# but an ALB target group would have refused to register it and the task would cycle forever.
#
# Tied to the same property that chooses the store, so the indicator is on exactly when Redis is
# actually in use. Setting dps.session-store=redis re-enables the check — and SessionStoreConfig
# already refuses to start if Redis is then unreachable, so nothing is silently unmonitored.
management.health.redis.enabled=${DPS_REDIS_HEALTH:false}

# --- Session storage ---
# 'redis' shares sessions across instances; anything else uses in-memory Caffeine.
# Chosen explicitly rather than inferred: silently degrading to in-memory in a multi-instance
# deployment would look like it worked, then log users out at random.
dps.session-store=${DPS_SESSION_STORE:memory}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# --- Workload identity (step 4) ---
# Signs the token the DPS presents to the BFF, so the BFF can tell a call relayed by the DPS from
# one made by anything else holding a valid user token. Must match web-experience.workload.dps-key.
# Generate:  openssl rand -base64 48
dps.workload.signing-key=${DPS_WORKLOAD_SIGNING_KEY:}

# --- Workload identity: asymmetric (preferred) ---
# The DPS's own Ed25519 PRIVATE key. Give the matching public key to the BFF as
# web-experience.workload.trust.dps.
dps.workload.private-key=${DPS_WORKLOAD_PRIVATE_KEY:}
