# =============================================================
# Digital Presentation Service (DPS)
# The authentication and authorization entry point for every micro-frontend origin.
# =============================================================
server.port=${DPS_PORT:8090}

# The DPS brokers through the BFF rather than calling Identity directly: the BFF already owns
# token issuance, brand resolution and the permission matrix, and a second implementation of
# any of those could disagree with the first.
dps.bff-base-url=${DPS_BFF_URL:http://localhost:8081}
dps.service-token=${DPS_SERVICE_TOKEN:wdZcoE9N3fhGST9heyi4QAXRTiFGWC5jKHhdyl05Pk8}

# Every micro-frontend origin must be listed. A wildcard is not permitted alongside
# allow-credentials, and credentials are exactly what carries the session cookie.
dps.allowed-origins=${DPS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179}

# Sliding session lifetime: activity extends it, idleness ends it.
dps.session-ttl-minutes=${DPS_SESSION_TTL_MINUTES:480}
dps.max-sessions=${DPS_MAX_SESSIONS:50000}

dps.cookie-name=${DPS_COOKIE_NAME:INFLUENCRM_SESSION}
# Secure cookies are never sent over plain HTTP, so this stays off for local development and
# MUST be enabled in any deployed environment.
dps.cookie-secure=${DPS_COOKIE_SECURE:false}
# Cross-origin micro-frontends need SameSite=None, which the spec only permits alongside Secure.
# Lax is correct while everything is same-site in development.
dps.cookie-same-site=${DPS_COOKIE_SAME_SITE:Lax}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
